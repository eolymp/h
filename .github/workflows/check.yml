name: check

on:
  push: { branches: [ main ] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-pr-{0}', github.event.pull_request.number) || format('check-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            gcov: gcov
          - compiler: clang++
            gcov: llvm-cov gcov
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y llvm
        if: matrix.compiler == 'clang++'
      - run: make -j"$(nproc)" check
        env:
          CXX: ${{ matrix.compiler }}
          GCOV: ${{ matrix.gcov }}

  musl:
    runs-on: ubuntu-latest
    container: alpine:3.21
    steps:
      - run: apk add --no-cache g++ make python3 git go clang
      - uses: actions/checkout@v4
      - run: make -j"$(nproc)" check

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -j"$(sysctl -n hw.ncpu)" check

  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: judge/go.mod
          cache: false
      - run: make judge

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make version BASE=${{ github.event.pull_request.base.sha }}

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make sanitize

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make mutants

  release:
    needs: [ linux, musl, macos, judge, sanitize, mutants ]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: read
        run: |
          version=$(sed -n 's/^#define EOLYMP_H_VERSION "\(.*\)"$/\1/p' src/core.h)
          if [ -z "$version" ]; then
            echo "src/core.h carries no EOLYMP_H_VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish headers that are not what src/ generates
        run: python3 tools/amalgamate.py --check

      - name: Release, unless this version already has one
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to do."
            exit 0
          fi
          if ! gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "eolymp.h $VERSION" \
            --generate-notes \
            eolymp.h eolymp-shapes.h; then
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "v$VERSION was released by another run meanwhile; nothing to do."
              exit 0
            fi
            exit 1
          fi
          echo "released v$VERSION"
