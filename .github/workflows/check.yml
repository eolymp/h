name: check

on:
  push: { branches: [ main ] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-pr-{0}', github.event.pull_request.number) || format('check-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            gcov: gcov
          - compiler: clang++
            gcov: llvm-cov gcov
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y llvm
        if: matrix.compiler == 'clang++'
      - run: make -j"$(nproc)" check
        env:
          CXX: ${{ matrix.compiler }}
          GCOV: ${{ matrix.gcov }}

  musl:
    runs-on: ubuntu-latest
    container: alpine:3.21
    steps:
      - run: apk add --no-cache g++ make python3 git go clang
      - uses: actions/checkout@v4
      - run: make -j"$(nproc)" check

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -j"$(sysctl -n hw.ncpu)" check

  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: make judge

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make mutants
